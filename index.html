<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Лабораторная №5 — Введение в Vue</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      color: #1f2933;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 15px;
      border: 2px solid transparent;
      background: #ddd;
      color: #1f2933;
      border-radius: 5px;
      cursor: pointer;
      font: inherit;
    }
    button.active {
      background: #1b6b47;
      color: #fff;
      border-bottom: 4px solid #0b2e1e;
      font-weight: bold;
    }
    :focus-visible {
      outline: 3px solid #1d4ed8;
      outline-offset: 2px;
    }
    .task {
      background: white;
      border-radius: 10px;
      padding: 20px;
      border-left: 6px solid #1b6b47;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .task h2 {
      margin-top: 0;
      margin-bottom: 4px;
    }
    .focus {
      color: #4b5563;
      margin: 0 0 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e5e7eb;
    }
    label {
      display: block;
      font-weight: bold;
      margin-top: 8px;
    }
    input {
      display: block;
      margin-top: 4px;
      padding: 6px;
      font: inherit;
      border: 1px solid #6b7280;
      border-radius: 4px;
    }
    button {
      margin-top: 8px;
    }
    ul {
      padding-left: 20px;
    }
    .time {
      font-size: 2rem;
      font-weight: bold;
      margin: 8px 0;
    }
  </style>
</head>
<body>
<div id="app">
  <main>
    <h1>Лабораторная №5 — Введение в Vue</h1>

    <nav class="tabs" aria-label="Задания">
      <button
              type="button"
              v-for="(tab, i) in tabs"
              :key="i"
              :class="{ active: currentTab === i }"
              :aria-pressed="currentTab === i ? 'true' : 'false'"
              :data-testid="'tab-' + (i + 1)"
              @click="currentTab = i"
      >
        Задание {{ i + 1 }}
      </button>
    </nav>

    <section class="task">
      <component :is="tabs[currentTab]"></component>
    </section>
  </main>
</div>

<script>
  const { createApp, ref, computed, watch, onMounted, onUnmounted, defineComponent } = Vue

  // --- ЗАДАНИЕ 1 ---
  const Task1 = defineComponent({
    template: `
      <div>
        <h2>Задача 1. Привет, Vue!</h2>
        <p class="focus">Фокус: интерполяция (<span v-pre>{{ }}</span>) и директива v-model.</p>
        <label for="t1-name">Ваше имя</label>
        <input id="t1-name" type="text" v-model="name" data-testid="t1-input" />
        <p data-testid="t1-greeting">Привет, {{ name }}!</p>
      </div>
    `,
    data() {
      return { name: 'Vue' }
    }
  })

  // --- ЗАДАНИЕ 2 ---
  const Task2 = defineComponent({
    template: `
      <div>
        <h2>Задача 2. Реактивный счётчик</h2>
        <p class="focus">Фокус: реактивные данные (ref) и обработка событий (@click).</p>
        <p data-testid="t2-value">Счётчик: {{ count }}</p>
        <button type="button" data-testid="t2-button" @click="count++">Увеличить</button>
      </div>
    `,
    setup() {
      const count = ref(0)
      return { count }
    }
  })

  // --- ЗАДАНИЕ 3 ---
  const Task3 = defineComponent({
    template: `
      <div>
        <h2>Задача 3. Условный рендеринг</h2>
        <p class="focus">Фокус: директивы v-if, v-else.</p>
        <button type="button" data-testid="t3-button" @click="visible = !visible">
          {{ visible ? 'Скрыть описание' : 'Показать описание' }}
        </button>
        <p v-if="visible" data-testid="t3-text">Vue — прогрессивный фреймворк для создания пользовательских интерфейсов.</p>
        <p v-else data-testid="t3-hidden">Описание скрыто.</p>
      </div>
    `,
    setup() {
      const visible = ref(true)
      return { visible }
    }
  })

  // --- ЗАДАНИЕ 4 ---
  const Task4 = defineComponent({
    template: `
      <div>
        <h2>Задача 4. Список элементов</h2>
        <p class="focus">Фокус: v-for и уникальные ключи :key.</p>
        <ul data-testid="t4-list">
          <li v-for="(item, index) in items" :key="item.id">{{ index + 1 }}. {{ item.title }}</li>
        </ul>
      </div>
    `,
    setup() {
      const items = ref([
        { id: 1, title: 'Изучить интерполяцию' },
        { id: 2, title: 'Освоить v-model' },
        { id: 3, title: 'Разобраться с v-for' },
        { id: 4, title: 'Написать вычисляемое свойство' }
      ])
      return { items }
    }
  })

  // --- ЗАДАНИЕ 5 ---
  const Task5 = defineComponent({
    template: `
      <div>
        <h2>Задача 5. Мини-форма</h2>
        <p class="focus">Фокус: v-model, обработка событий (@submit.prevent), работа с массивами.</p>
        <form @submit.prevent="addPerson" data-testid="t5-form">
          <label for="t5-name">Имя</label>
          <input id="t5-name" type="text" v-model="name" data-testid="t5-name" />
          <label for="t5-age">Возраст</label>
          <input id="t5-age" type="number" v-model.number="age" data-testid="t5-age" />
          <button type="submit" data-testid="t5-submit">Добавить</button>
        </form>
        <ul data-testid="t5-list">
          <li v-for="person in people" :key="person.id">{{ person.name }}, {{ person.age }}</li>
        </ul>
      </div>
    `,
    setup() {
      const name = ref('')
      const age = ref('')
      const people = ref([])
      let nextId = 1

      const addPerson = () => {
        const trimmed = name.value.trim()
        if (!trimmed || typeof age.value !== 'number' || !(age.value > 0)) return
        people.value.push({ id: nextId++, name: trimmed, age: age.value })
        name.value = ''
        age.value = ''
      }

      return { name, age, people, addPerson }
    }
  })

  // --- ЗАДАНИЕ 6 ---
  const Task6 = defineComponent({
    template: `
      <div>
        <h2>Задача 6. Вычисляемые свойства</h2>
        <p class="focus">Фокус: вычисляемые свойства (computed).</p>
        <label for="t6-number">Число</label>
        <input id="t6-number" type="number" v-model.number="number" data-testid="t6-input" />
        <p data-testid="t6-number">Число: {{ shown }}</p>
        <p data-testid="t6-square">Квадрат: {{ square }}</p>
        <p data-testid="t6-cube">Куб: {{ cube }}</p>
      </div>
    `,
    setup() {
      const number = ref(0)
      const value = computed(() => (typeof number.value === 'number' ? number.value : 0))
      const shown = computed(() => (typeof number.value === 'number' ? number.value : '—'))
      const square = computed(() => value.value ** 2)
      const cube = computed(() => value.value ** 3)
      return { number, shown, square, cube }
    }
  })

  // --- ЗАДАНИЕ 7 ---
  const Task7 = defineComponent({
    template: `
      <div>
        <h2>Задача 7. Watch и жизненный цикл</h2>
        <p class="focus">Фокус: onMounted, watch, реактивность.</p>
        <p class="time" data-testid="t7-time">{{ timeText }}</p>
        <p data-testid="t7-greeting">{{ greeting }}</p>
      </div>
    `,
    setup() {
      const now = ref(new Date())
      let timerId = null

      const timeText = computed(() => now.value.toLocaleTimeString('ru-RU'))
      const greeting = computed(() => {
        const hour = now.value.getHours()
        if (hour >= 5 && hour <= 11) return 'Доброе утро'
        if (hour >= 12 && hour <= 17) return 'Добрый день'
        if (hour >= 18 && hour <= 22) return 'Добрый вечер'
        return 'Доброй ночи'
      })

      watch(now, (value) => {
        console.log('Время обновлено: ' + value.toLocaleTimeString('ru-RU'))
      })

      onMounted(() => {
        timerId = setInterval(() => {
          now.value = new Date()
        }, 1000)
      })

      onUnmounted(() => {
        clearInterval(timerId)
      })

      return { timeText, greeting }
    }
  })

  createApp({
    setup() {
      const currentTab = ref(0)
      const tabs = [Task1, Task2, Task3, Task4, Task5, Task6, Task7]
      return { currentTab, tabs }
    }
  }).mount('#app')
</script>
</body>
</html>
